<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>cliamp</title>
<link rel="stylesheet" href="app.css">
</head>
<body data-tab="now">
<div id="banner" hidden>Reconnecting…</div>
<section id="now" class="view" aria-label="Now Playing">
  <div id="fs-bg" class="fs-bg" aria-hidden="true"></div>
  <button id="b-fs-close" class="ic fs-close fs-only" data-icon="collapse" aria-label="Close fullscreen" title="Close"></button>
  <div id="idle" class="idle" hidden>
    <div class="idle-art" data-icon="note"></div>
    <p>Nothing playing</p>
    <a class="btn primary" href="#browse">Browse</a>
  </div>
  <div id="player" hidden>
    <div id="cover" class="cover">
      <div class="ph" data-icon="note"></div>
      <img id="art-cover" class="art" alt="" hidden>
      <div class="disc-slide"><img id="art-disc" class="art disc" alt="" hidden></div>
    </div>
    <div class="meta">
      <div class="titlerow">
        <h1 id="title"><span id="trackno" class="fs-inline"></span><span id="titletext"></span></h1>
        <button id="b-heart" class="ic heart" aria-label="Favorite" hidden></button>
      </div>
      <p class="artist-line"><img id="artist-img" class="avatar" alt="" hidden><span id="artist"></span></p>
      <p id="album" class="dim"></p>
    </div>
    <div class="seek">
      <span id="pos">0:00</span>
      <div id="bar" role="slider" tabindex="0" aria-label="Position" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
        <div class="track"><div id="fill"></div></div><div id="knob"></div>
      </div>
      <span id="dur">0:00</span>
    </div>
    <div id="tech" class="tech fs-only" hidden></div>
    <p id="next" class="next fs-only" hidden></p>
    <div class="transport">
      <button id="b-prev" class="ic" data-icon="prev" aria-label="Previous"></button>
      <button id="b-toggle" class="ic big" data-icon="play" aria-label="Play or pause"></button>
      <button id="b-next" class="ic" data-icon="next" aria-label="Next"></button>
    </div>
    <div class="extras">
      <button id="b-fs" class="ic" data-icon="expand" aria-label="Fullscreen" title="Fullscreen"></button>
      <button id="b-lyrics" class="ic" data-icon="lyrics" aria-label="Lyrics" title="Lyrics"></button>
      <button id="b-shuffle" class="ic" data-icon="shuffle" aria-label="Shuffle"></button>
      <button id="b-repeat" class="ic" data-icon="repeat" aria-label="Repeat"><b id="rep1" hidden>1</b></button>
    </div>
    <div class="vol">
      <input id="volume" type="range" min="-30" max="6" step="1" value="0" aria-label="Volume">
      <span id="voltxt" class="dim">0 dB</span>
    </div>
  </div>
</section>

<section id="queue" class="view" aria-label="Queue"></section>
<section id="favorites" class="view" aria-label="Favorites"></section>
<section id="browse" class="view" aria-label="Browse"></section>
<section id="search" class="view" aria-label="Search">
  <div id="prov" class="seg"></div>
  <input id="q" type="search" placeholder="Search this provider" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search">
  <div id="results"></div>
</section>

<section id="settings" class="view" aria-label="Settings"></section>

<div id="lyrics" class="sheet" hidden aria-label="Lyrics">
  <div class="sheet-head">
    <h2>Lyrics</h2>
    <button id="b-lyrics-close" class="ic" aria-label="Close lyrics">✕</button>
  </div>
  <ul id="lyric-lines" class="list"></ul>
  <p id="lyric-empty" class="empty" hidden>no lyrics for this track</p>
</div>
<div id="scrim" hidden></div>

<nav id="tabs">
  <a href="#now" data-tab="now"><i data-icon="note"></i>Now Playing</a>
  <a href="#queue" data-tab="queue"><i data-icon="queue"></i>Queue</a>
  <a href="#browse" data-tab="browse"><i data-icon="browse"></i>Browse</a>
  <a href="#favorites" data-tab="favorites"><i data-icon="heartfill"></i>Favorites</a>
  <a href="#search" data-tab="search"><i data-icon="search"></i>Search</a>
  <a href="#settings" data-tab="settings"><i data-icon="gear"></i>Settings</a>
</nav>
<div id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
