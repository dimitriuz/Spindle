name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make release
      - run: cp web.lua dist/release/web.lua && cd dist/release && sha256sum cliamp-web-* web.lua > sha256sums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
