name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: vet, test (race) and page tests
        run: |
          go vet ./...
          go test -race ./...
          node webui/app_test.js
      - name: release builds compile
        run: make release
